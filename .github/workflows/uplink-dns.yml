name: Uplink DNS routing
on:
  push:
    paths: ['native/mgu-uplink/**', '.github/workflows/uplink-dns.yml']
  pull_request:
    paths: ['native/mgu-uplink/**', '.github/workflows/uplink-dns.yml']
permissions:
  contents: read
jobs:
  routing:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: 1.27.2
      - name: Vet and unit tests
        working-directory: native/mgu-uplink
        run: |
          test -z "$(gofmt -l netcfg.go session.go status.go dns_routing_test.go)"
          go vet ./...
          go test ./...
      - name: Overlapping subnet routing in an isolated Linux namespace
        working-directory: native/mgu-uplink
        run: |
          go test -c -o /tmp/mgu-uplink-test
          sudo env MGU_UPLINK_NETNS_TEST=1 /tmp/mgu-uplink-test -test.run '^TestOverlappingDNSNetwork$' -test.v
      - name: Build candidate executable
        working-directory: native/mgu-uplink
        run: CGO_ENABLED=0 go build -trimpath -buildvcs=false -ldflags='-s -w -X main.version=0.7.16' -o /tmp/mgu-uplink .
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: uplink-dns-candidate
          path: /tmp/mgu-uplink
