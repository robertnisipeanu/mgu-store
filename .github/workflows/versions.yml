# A pull request leaves release-time versions as its base has them, and a
# changed component with a CHANGELOG says what changes under
# "## Unreleased" (release/README.md, "Versions").
name: Versions

# runs on the pull request's merge commit; its first parent is the base
on:
  pull_request:

permissions:
  contents: read

# Actions are pinned to commits.
jobs:
  versions:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.12.0

      - run: node release/release.js versions HEAD^1
