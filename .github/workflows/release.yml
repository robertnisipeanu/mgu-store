# Publishes new versions of the Store's apps and tools to this repository's
# (private) GitHub Releases, with the catalog.json the car's updater reads
# (release/README.md). Push a v* tag, or run it by hand with the component
# ids to publish (empty: every component).
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      components:
        description: Component ids to publish, space-separated (empty publishes every component)
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

# Actions are pinned to commits.
jobs:
  publish:
    # main and v* tags only: work-in-progress branches do not publish
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # SOURCE_DATE_EPOCH comes from each component's last commit
          fetch-depth: 0
          # publishing talks to the API through GH_TOKEN, not git
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.12.0

      # mgu-uplink's build (the one tool with a native build step)
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.27.2

      # No oap-sdk donor here: the Store publishes as its source package,
      # which the head unit builds.
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          MGU_PUBLISH: github:${{ github.repository }}
          COMPONENTS: ${{ inputs.components }}
        run: node release/release.js publish $COMPONENTS

      - name: Published catalog
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          MGU_PUBLISH: github:${{ github.repository }}
        run: node release/release.js list
