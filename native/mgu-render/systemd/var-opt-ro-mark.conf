# mgu-render: at each NodeStateManager shutdown of the head unit (a switch-off, a restart asked for, a restart
# recmgr or crashhandler asked for after a crash), before /var/opt goes read-only, record whether a restart
# record names the HMI for a boot that mounted the page template and was not yet confirmed healthy
# (mgu-render-hmi.sh --shutdown). It reads small files only; a failure ("-") never holds up the shutdown.
[Service]
ExecStartPre=-/bin/sh /var/opt/mgu-render/current/mgu-render-hmi.sh --shutdown /var/opt/mgu-render/current /var/opt/mgu-render/hmi
