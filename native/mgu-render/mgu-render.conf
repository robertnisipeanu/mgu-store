# mgu-render settings. Values shown are the built-in defaults; any key can also be given on the
# command line as -s key=value (applied in order). "on-car" marks values only a car can confirm
# (README.md, "On the car").

# --- sockets -----------------------------------------------------------------
# Our own socket: mgu-render.socket's (keep the two the same); bound here only when the daemon runs
# without the socket unit (by hand), with this group (empty: mode 0666).
socket_path = /run/mgu-render/render.sock
socket_group =
# The community renderers' socket: a link to ours while none of shared_yield (other renderers' unit
# files) is present, else the other renderer's. Empty: not served.
shared_path = /run/mgu-renderd/renderd.sock
shared_yield = /etc/systemd/system/mgu-renderd.service, /run/systemd/system/mgu-renderd.service, /etc/systemd/system/idrive7-renderd.service
# display-bridge's socket (mgu-apps): a link to ours, where its apps (DOOM, draw_gallery,
# display_bridge_demo) speak its protocol; a socket something listens on there is left alone, one
# nobody listens on is replaced. Empty: not served.
bridge_path = /dev/shm/display-bridge/bridge.sock

# --- layer mode: the app's own layer over the HMI (Winston) ---------------
wayland_display = wayland-0
# 0: the lowest ivi screen id, the centre display.
screen_id = 0
# The content area apps are told in READY (x,y,w,h); auto: 108,82,1790,638 on a 1920x720 screen
# (iDrive 7), 0,76,2880,764 on 2880x960 (iDrive 8).
app_area = auto
# Layer apps hide while one of these is visible: SID_VIDEO_ANALOG_HU, SID_VIDEO_DIGITAL_HU,
# SID_VIDEOAR_HU, SID_VIDEOAR_HMI_HU (camera, video). On-car: the reversing camera's surface.
yield_surfaces = 0x197, 0x198, 0x19d, 0x19f

# --- embed mode: inside the app's HMI page (HmiMain3D's compositor) -------
embed = 1
hmi_display = wayland-1
# The ivi id the page template samples, and the template's box on the screen (iDrive 7).
embed_surface_id = 0x500
embed_area = 104,88,1796,632
# Written by mgu-render-hmi.sh once the template is mounted; embed is offered only when the HMI
# process (hmi_process) started after it.
embed_marker = /run/mgu-render/hmi-template
hmi_process = HmiMain3D

# --- front-app gating -------------------------------------------------------
# Reports the uids of the apps whose screens are in front; an app shows only then. Empty: no gate.
foreground_gate = /usr/bin/node /var/opt/mgu-render/current/foreground_gate.js
# Upstream and IterioDev apps (layer) are gated too: hidden while the gate names another app in
# front. They hide themselves when their screen goes.
gate_legacy = 1

# --- touch routing (IterioDev's divert) -------------------------------------
# Apps claim areas; while a claiming app is shown, touches that start there go to it and the rest
# go on to the HMI. The display's touch PDUs come to the HMI on UDP 30567; ours are diverted to 30570
# (table ip mgu_render), IterioDev's renderer's to 30568.
touch = 1
# auto: vlan73 when it exists (the car), else lo (the emulator, a VM).
touch_iface = auto
# The display's address on vlan73 (iDrive 8 car; the same address in the iDrive 7 firewall). On-car.
touch_saddr = 160.48.199.115
# Where apps may claim, x,y,w,h; auto: 84,76,1836,644 on 1920x720 (below the title strip, right of
# the back column; on-car), 0,76,2880,764 on 2880x960.
touch_area = auto

# --- controller ---------------------------------------------------------------
# The HMI's controller gate (idrive7-apps kit/renderd/inputgate, mgu-inputgate.so, when installed):
# its file, kept fresh while a shown app holds GRAB and its event socket is ours (not upstream's
# renderer's), and the library name looked for in the HMI.
controller_gate = /run/mgu-renderd/inputgate
controller_lib = mgu-inputgate

# --- diagnostics ----------------------------------------------------------------
# Each connection's incoming messages to <dir>/<app>-<pid>-<n>.bin, for --replay. Empty: off.
record_dir =
verbose = 0
