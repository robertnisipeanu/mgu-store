# mgu-uplink: which processes reach the internet through the USB adapter.
# Nothing else on the unit does. "key = value", '#' starts a comment.
#
# These are the defaults an update replaces. Put the unit's own settings in
# local_conf: each key there replaces the one here (uids adds to the shipped
# list), and updates keep it.
local_conf = /var/opt/mgu-uplink/mgu-uplink.local.conf

# OAP apps, by name as in /var/opt/public/oap/oap_12201/security/uids.txt.
# An app's uid is looked up again every few seconds (a reinstall can change it).
apps =

# Non-app processes, by numeric uid.
# 12990: the updater's fetcher.
# 12993: mgu-tailscale (native/mgu-tailscale), the one Tailscale node on the car.
# It is the only service that dials out: raluca-car (12991) reaches live-codex
# through its SOCKS5 proxy over loopback, and waze-diag (12992) is reverse-proxied
# to on loopback, so neither needs egress of its own: only the one node dials out.
uids = 12990, 12993

# usb: the first USB Ethernet adapter the kernel drives.
# usbecm: a CDC-ECM stick the kernel has no driver for (Huawei HiLink,
# switched out of its CD-ROM mode automatically), driven from user space.
# netdev:<ifname>: that existing interface instead.
uplink = usb

# Use only the USB adapter with this VID:PID (lsusb, or idVendor:idProduct in sysfs).
# usb_device = 0b95:1790

# Routing table and the first of the three ip rule priorities this service owns.
# table = 110
# rule_pref = 1100
