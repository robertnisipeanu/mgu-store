# mgu-uplink: which processes reach the internet through the USB uplink.
# Nothing else on the unit does. "key = value", '#' starts a comment.
#
# These are the defaults an update replaces. Put the unit's own settings in
# local_conf: each key there replaces the one here (uids adds to the shipped
# list), and updates keep it.
local_conf = /var/opt/mgu-uplink/mgu-uplink.local.conf

# What the Store sets through requests (preferred, wifi), read after
# local_conf; written by the service, kept by updates.
settings_conf = /var/opt/mgu-uplink/mgu-uplink.settings.conf

# OAP apps, by name as in /var/opt/public/oap/oap_12201/security/uids.txt.
# An app's uid is looked up again every few seconds (a reinstall can change it).
apps =

# Non-app processes, by numeric uid. Installed components that need the
# internet add theirs through /var/opt/mgu-uplink/uids.d/ and apps.d/
# (written by the deploy tool; the updater's fetcher is uids.d/mgu-updater).
uids =

# The uplink takes whatever is joined or plugged in, in this order: Wi-Fi
# (while on), a USB Ethernet adapter the kernel drives, a CDC-ECM stick (a
# Huawei HiLink stick is switched out of its CD-ROM mode), an Android phone
# in USB tethering (RNDIS or NCM), an iPhone with Personal Hotspot. Devices
# can be swapped while it runs. netdev:<ifname> uses that existing interface
# instead (no Wi-Fi then).
uplink = auto

# Tried first: wifi, usb (adapters and sticks) or phone; the others follow.
# Empty for the order above.
preferred =

# Wi-Fi: on joins saved networks with the unit's radio (wlan1) when the car
# itself does not use it; off leaves the radio as it is.
wifi = off

# Wi-Fi joins a network seen on 2.4 GHz there only (wireless CarPlay and
# Android Auto keep 5 GHz); on joins on either band.
wifi_5ghz = off

# Routing table and the first of the three ip rule priorities this service owns.
# table = 110
# rule_pref = 1100
