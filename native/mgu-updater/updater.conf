# mgu-updater settings (README.md). Any key can be overridden in local_conf,
# which updates never touch.
local_conf = /var/opt/mgu-updater/updater.local.conf

# --- sources --------------------------------------------------------------------
# The sources the updater installs from (README.md, "Sources"): root-only,
# seeded by the installers, written by the updater (the Store and the phone
# page change it). Without it: the built-in source alone.
sources = /var/opt/mgu-updater/sources.json
# The tokens (README.md, "Tokens"): <credentials_dir>/tokens.json and
# token-<id>, root-only.
credentials_dir = /var/opt/mgu-updater/credentials
# The built-in source (id mgu-store), which cannot be removed.
builtin_repo = robertnisipeanu/mgu-store
# The GitHub App whose device flow adds a token (README.md, "Signing in to
# GitHub"): https://github.com/apps/mgu-store, Contents read-only. Its client id
# is public; no client secret or private key is used. Empty: no sign-in, a
# pasted token still works. Its page, whose install page the Store shows for a
# private repo a sign-in does not reach; empty: not shown.
github_client_id = Iv23li9nab1iob4a6eyC
github_app_url = https://github.com/apps/mgu-store
github_api = https://api.github.com
github_web = https://github.com
# PEM roots for a host with its own CA. Empty: Node's bundled roots.
ca_file =
check_interval_s = 21600
first_check_s = 60
# USB media: mount points directly under these folders (udisks mounts a
# stick at /media/<label>), looked at every usb_poll_s.
mounts = /proc/mounts
usb_roots = /media
usb_poll_s = 5
# The most a repo tarball download may be.
repo_max_bytes = 67108864

# --- building on the unit -----------------------------------------------------------
# A repo's own build script (mgu-repo.json "build": {"node": ...}) runs as
# this uid: no account, not in the uplink's lists (no network), writing only
# its own folder; stopped past build_timeout_s or build_max_bytes (the repo
# copy and what it writes). Every process of this uid is killed around a
# build: no other service may use it (12992 is waze-diag's, 12993
# mgu-tailscale's, 12994 robertn-ampel's).
build_uid = 12995
build_gid = 12995
build_timeout_s = 600
build_max_bytes = 209715200

# --- downloads ----------------------------------------------------------------
# Downloads run as this uid, the one the apps-only uplink lets out
# (native/mgu-uplink: uids =). It has no account and writes only its folder.
fetch_uid = 12990
fetch_gid = 12990
# The uplink's lease (interface, dns): absent while the uplink is down.
# Empty: the system's own resolver and routes.
lease = /run/mgu-uplink/lease.json

# --- installing -----------------------------------------------------------------
deploy = /var/opt/mgu-deploy/mgu-deploy.sh
# Tools the updater itself runs on, checked after each of their installs
# (README.md, "Tools the updater runs on"): the deploy tool must answer, the
# uplink must give internet back within bootstrap_check_s, or the version
# installed before is put back.
deploy_tool = mgu-deploy
uplink_tool = mgu-uplink
bootstrap_check_s = 90
# native/app-privacy: its state shows in the Store
privacy_tool = /var/opt/app-privacy/current/patch_mainapp.js
state_dir = /var/opt/mgu-updater/state
tool_root = /var/opt
oap_root = /var/opt/public/oap
mainapp_uid = 12201
# The Store app: its uid (from MainApp's registry) gets the secret for the
# privileged requests in its data folder (README.md, "The socket").
store_app = robertn_store

# --- restarting the head unit ------------------------------------------------------
# The Store's Restart head unit: the Node State Manager's restart request
# (LifecycleControl.RequestNodeRestart, reason 7 = Application, normal
# shutdown), as the HMI asks for it (README.md, "Restarting the head unit").
reboot = /usr/bin/nsm_control --requestRestart 7 --normal

# --- log ----------------------------------------------------------------------
# Every line the daemon logs, with its time, readable by others (raluca-car's
# diag `file` op reads /tmp); 128 KiB, then <log_file>.1. Empty: journal only.
log_file = /tmp/mgu-updater.log

# --- Store app socket -------------------------------------------------------------
socket = /dev/shm/mgu-updater/updater.sock
socket_group = tm_oap_app

# --- phone page (js/web.js) --------------------------------------------------------
# Served as web_uid:web_gid on web_port, on 127.0.0.1 and web_iface's address
# (the car's hotspot) while it is on; web_secret is its copy of the secret,
# owned by its uid.
web_uid = 12996
web_gid = 12202
web_port = 8470
web_iface = wlan_bridge
web_secret = /run/mgu-updater/web-secret
